<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Data Miner</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-monospace, SFMono-Regular, Menlo, monospace; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% -20%, #173a30, #040807 55%); color: #d7ffe8; }
      main { width: min(1050px, 94vw); margin: 0 auto; padding: 38px 0 56px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
      h1 { margin: 0; color: #65ffad; letter-spacing: -.04em; }
      .status { display: flex; align-items: center; gap: 8px; color: #91bfa5; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #617069; box-shadow: 0 0 0 4px #61706922; }
      .dot.active { background: #43ff9a; box-shadow: 0 0 14px #43ff9a; }
      .panel { background: #08140fdd; border: 1px solid #24523d; border-radius: 14px; padding: 20px; box-shadow: 0 20px 80px #0008; }
      .hero { display: grid; grid-template-columns: 1.4fr .8fr; gap: 16px; }
      .hashrate { font-size: clamp(42px, 8vw, 80px); font-weight: 800; color: #65ffad; line-height: 1; margin: 18px 0 6px; }
      .unit, .muted { color: #769b86; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0; }
      .metric { background: #07100c; border: 1px solid #183b2b; border-radius: 10px; padding: 14px; }
      .metric strong { display: block; font-size: 22px; color: #caffdf; margin-top: 7px; }
      label { display: grid; gap: 8px; color: #8fb7a1; font-size: 13px; }
      select, input, button { font: inherit; padding: 11px 12px; border-radius: 8px; border: 1px solid #2b6a4c; }
      select, input { background: #050c09; color: #d7ffe8; width: 100%; }
      .controls { display: grid; gap: 14px; }
      button { cursor: pointer; font-weight: 800; background: #42ee90; color: #03140b; border-color: #42ee90; }
      button.stop { background: #ff5e72; border-color: #ff5e72; }
      .log { height: 170px; overflow: auto; margin-top: 16px; padding: 12px; background: #030806; border: 1px solid #183b2b; border-radius: 10px; color: #7fc99e; font-size: 12px; line-height: 1.7; }
      .log div::before { content: "> "; color: #43ff9a; }
      @media (max-width: 760px) { .hero, .grid { grid-template-columns: 1fr 1fr; } .hero > :first-child { grid-column: 1 / -1; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>Browser Data Miner</h1><div class="muted">WebCrypto Proof-of-Work Console</div></div>
        <div class="status"><span class="dot" id="dot"></span><span id="status">IDLE</span></div>
      </header>
      <section class="hero">
        <div class="panel">
          <div class="muted">CURRENT HASHRATE</div>
          <div class="hashrate"><span id="rate">0.00</span> <span class="unit">kH/s</span></div>
          <div class="grid">
            <div class="metric"><span class="muted">Total hashes</span><strong id="total">0</strong></div>
            <div class="metric"><span class="muted">Valid shares</span><strong id="shares">0</strong></div>
            <div class="metric"><span class="muted">Workers</span><strong id="workers">0</strong></div>
            <div class="metric"><span class="muted">Session</span><strong id="elapsed">00:00</strong></div>
          </div>
        </div>
        <aside class="panel controls">
          <label>Algorithm<input value="SHA-256 / WebCrypto" disabled /></label>
          <label>Worker threads<select id="threadCount"></select></label>
          <label>Share difficulty<select id="difficulty"><option value="2">2 — low</option><option value="3" selected>3 — normal</option><option value="4">4 — high</option></select></label>
          <button id="toggle">START MINING</button>
        </aside>
      </section>
      <section class="panel" style="margin-top:16px">
        <div class="muted">MINER OUTPUT</div>
        <div class="log" id="log"><div>Miner initialized. Waiting for workers.</div></div>
      </section>
    </main>
    <script>
      const $ = id => document.getElementById(id);
      const maxThreads = Math.min(4, Math.max(1, navigator.hardwareConcurrency || 2));
      for (let n = 1; n <= maxThreads; n++) $("threadCount").add(new Option(`${n} worker${n > 1 ? "s" : ""}`, n, n === Math.min(2, maxThreads), n === Math.min(2, maxThreads)));
      let active = false, pool = [], total = 0, shares = 0, lastTotal = 0, started = 0, timer;
      const workerSource = `
        let running = true;
        const enc = new TextEncoder();
        onmessage = e => { if (e.data === 'stop') running = false; };
        async function mine() {
          let batch = 0;
          while (running) {
            const seed = Date.now().toString(16) + Math.random().toString(16) + batch;
            const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(seed)));
            batch++;
            if (hash[0] === 0 && hash[1] < 16) postMessage({ type: 'share', hash: [...hash].map(x => x.toString(16).padStart(2, '0')).join('') });
            if (batch % 80 === 0) { postMessage({ type: 'hashes', count: 80 }); await new Promise(r => setTimeout(r, 12)); }
          }
        }
        mine();`;
      function log(message) {
        const row = document.createElement("div");
        row.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        $("log").prepend(row);
      }
      function start() {
        active = true; total = 0; shares = 0; lastTotal = 0; started = Date.now();
        $("toggle").textContent = "STOP MINING"; $("toggle").classList.add("stop");
        $("dot").classList.add("active"); $("status").textContent = "MINING";
        const url = URL.createObjectURL(new Blob([workerSource], { type: "text/javascript" }));
        const count = Number($("threadCount").value);
        for (let i = 0; i < count; i++) {
          const worker = new Worker(url);
          worker.onmessage = ({ data }) => {
            if (data.type === "hashes") total += data.count;
            if (data.type === "share") { shares++; log(`Share accepted  #${shares}  ${data.hash.slice(0, 20)}…`); }
          };
          pool.push(worker);
        }
        $("workers").textContent = count; log(`${count} mining worker${count > 1 ? "s" : ""} started`);
        timer = setInterval(render, 1000);
      }
      function stop() {
        active = false; pool.forEach(worker => worker.terminate()); pool = [];
        clearInterval(timer); render(); $("rate").textContent = "0.00"; $("workers").textContent = "0";
        $("toggle").textContent = "START MINING"; $("toggle").classList.remove("stop");
        $("dot").classList.remove("active"); $("status").textContent = "IDLE"; log("Mining stopped");
      }
      function render() {
        const delta = total - lastTotal; lastTotal = total;
        $("rate").textContent = (delta / 1000).toFixed(2);
        $("total").textContent = total.toLocaleString(); $("shares").textContent = shares;
        const seconds = Math.floor((Date.now() - started) / 1000);
        $("elapsed").textContent = `${String(Math.floor(seconds / 60)).padStart(2,"0")}:${String(seconds % 60).padStart(2,"0")}`;
      }
      $("toggle").addEventListener("click", () => active ? stop() : start());
    </script>
  </body>
</html>
