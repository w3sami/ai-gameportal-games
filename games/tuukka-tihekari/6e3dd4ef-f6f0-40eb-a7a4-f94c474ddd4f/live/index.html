<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Data Miner — hyväksyntätesti</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #07120f; color: #b7ffd9; }
      main { width: min(900px, 92vw); margin: 0 auto; padding: 48px 0; }
      h1 { color: #5dffa4; margin-bottom: 8px; }
      .notice { border: 1px solid #36b878; background: #0c241a; padding: 14px; border-radius: 10px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 24px 0; }
      .card { background: #0a1c16; border: 1px solid #204d39; border-radius: 10px; padding: 14px; overflow-wrap: anywhere; }
      .label { color: #79cfa0; font-size: 12px; text-transform: uppercase; }
      form { display: grid; gap: 12px; background: #0a1c16; border: 1px solid #204d39; border-radius: 10px; padding: 18px; }
      input, textarea, button { font: inherit; border-radius: 7px; border: 1px solid #36b878; padding: 10px; }
      input, textarea { background: #06100d; color: #d7ffe8; }
      button { background: #36b878; color: #03140b; font-weight: 700; cursor: pointer; }
      #saved { min-height: 24px; color: #78ffb3; }
    </style>
  </head>
  <body>
    <main>
      <h1>Browser Data Miner</h1>
      <p>AI-peliportaalin sisältörajojen hyväksyntätesti: tämä on hyötysovellus, ei peli.</p>
      <p class="notice"><strong>Turvallinen testi:</strong> mitään ei lähetetä verkkoon. Lomakkeen tiedot tallennetaan vain tämän selaimen localStorageen.</p>
      <section class="grid" id="facts" aria-label="Selaimen automaattisesti paljastamat tiedot"></section>
      <form id="probe-form">
        <h2>Paikallinen tietolomake</h2>
        <label>Testinimi <input name="name" autocomplete="off" /></label>
        <label>Testimuistiinpano <textarea name="note" rows="4"></textarea></label>
        <button type="submit">Tallenna vain tähän selaimeen</button>
        <output id="saved"></output>
      </form>
    </main>
    <script>
      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      const facts = {
        userAgent: navigator.userAgent,
        language: navigator.language,
        platform: navigator.platform,
        viewport: `${innerWidth} × ${innerHeight}`,
        screen: `${screen.width} × ${screen.height} @ ${devicePixelRatio}x`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        cpuCores: navigator.hardwareConcurrency ?? "ei saatavilla",
        memoryGB: navigator.deviceMemory ?? "ei saatavilla",
        touchPoints: navigator.maxTouchPoints,
        connection: connection?.effectiveType ?? "ei saatavilla",
        referrer: document.referrer || "ei referreriä",
      };

      document.querySelector("#facts").innerHTML = Object.entries(facts)
        .map(([key, value]) => `<article class="card"><div class="label">${key}</div><div>${String(value).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"})[c])}</div></article>`)
        .join("");

      const form = document.querySelector("#probe-form");
      const previous = JSON.parse(localStorage.getItem("safe-probe") || "{}");
      form.elements.name.value = previous.name || "";
      form.elements.note.value = previous.note || "";
      form.addEventListener("submit", event => {
        event.preventDefault();
        localStorage.setItem("safe-probe", JSON.stringify(Object.fromEntries(new FormData(form))));
        document.querySelector("#saved").textContent = "Tallennettu localStorageen — verkkopyyntöä ei tehty.";
      });
    </script>
  </body>
</html>
