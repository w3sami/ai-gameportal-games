<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Matopeli</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Courier New", ui-monospace, monospace;
      --screen: #9eae79;
      --pixel: #18271f;
      --key: #bac69a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 3vw, 28px);
      background: #111815;
      color: white;
      overflow-x: hidden;
    }
    .game-shell { width: min(560px, 100%); }
    h1 { margin: 0 0 14px; color: #c4d39b; font-size: clamp(28px, 8vw, 48px); letter-spacing: -.06em; }
    .bezel { padding: clamp(10px, 3vw, 18px); background: #202a24; }
    .lcd {
      position: relative;
      padding: 10px;
      background: var(--screen);
      color: var(--pixel);
      box-shadow: inset 0 0 16px #28352255;
    }
    .status { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 7px; font-size: 13px; font-weight: 900; }
    canvas { display: block; width: 100%; aspect-ratio: 1; image-rendering: pixelated; border: 3px solid var(--pixel); background: var(--screen); touch-action: none; }
    .message {
      position: absolute;
      inset: 42px 13px 13px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 22px;
      background: #9eae79e8;
      font-weight: 900;
      line-height: 1.55;
      cursor: pointer;
    }
    .message[hidden] { display: none; }
    .difficulty { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 14px; padding: 0; border: 0; }
    .difficulty legend { grid-column: 1 / -1; width: 100%; margin-bottom: 3px; color: #a9b7ae; font: 11px system-ui, sans-serif; letter-spacing: .12em; }
    .difficulty button {
      min-height: 44px;
      border: 1px solid #667251;
      border-radius: 4px;
      background: #202a24;
      color: #bac69a;
      font: 700 12px/1.2 "Courier New", monospace;
      cursor: pointer;
    }
    .difficulty button[aria-pressed="true"] { background: var(--key); color: var(--pixel); box-shadow: inset 0 -3px #667251; }
    .difficulty small { display: block; margin-top: 3px; font-size: 10px; }
    .controls { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: clamp(18px, 6vw, 46px); margin-top: 18px; }
    .softkeys { display: grid; gap: 12px; }
    .softkeys button, .pad button {
      border: 0;
      color: var(--pixel);
      background: var(--key);
      box-shadow: 0 4px 0 #667251;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }
    .softkeys button { min-width: 120px; min-height: 46px; border-radius: 4px; }
    .pad { width: 184px; height: 150px; display: grid; grid-template: repeat(3, 50px) / repeat(3, 58px); justify-content: center; }
    .pad button { font-size: 22px; border-radius: 4px; margin: 3px; }
    .pad button:active, .softkeys button:active { translate: 0 3px; box-shadow: 0 1px 0 #667251; }
    .up { grid-column: 2; }
    .left { grid-column: 1; grid-row: 2; }
    .ok { grid-column: 2; grid-row: 2; font-size: 12px !important; }
    .right { grid-column: 3; grid-row: 2; }
    .down { grid-column: 2; grid-row: 3; }
    .help { margin: 16px 0 0; color: #a9b7ae; font: 13px/1.45 system-ui, sans-serif; }
    @media (max-width: 470px) {
      .controls { grid-template-columns: 1fr; }
      .softkeys { grid-template-columns: 1fr 1fr; order: 2; }
      .softkeys button { min-width: 0; }
      .pad { margin: auto; }
      .help { text-align: center; }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Matopeli">
    <h1>Matopeli</h1>
    <section class="bezel">
      <div class="lcd">
        <div class="status"><span>PISTEET <b id="score">0</b></span><span>ENNÄTYS <b id="best">0</b></span></div>
        <canvas id="game" width="300" height="300" aria-label="Matopelin pelialue"></canvas>
        <div class="message" id="message" role="button" tabindex="0">MAT0<br><small>Paina OK tai nuolinäppäintä</small></div>
      </div>
    </section>
    <fieldset class="difficulty">
      <legend>VAIKEUSTASO</legend>
      <button type="button" data-level="easy" aria-pressed="false">HELPPO</button>
      <button type="button" data-level="normal" aria-pressed="true">NORMAALI</button>
      <button type="button" data-level="hard" aria-pressed="false">VAIKEA</button>
    </fieldset>
    <div class="controls">
      <div class="softkeys">
        <button id="pause" type="button">TAUKO</button>
        <button id="restart" type="button">UUSI PELI</button>
      </div>
      <nav class="pad" aria-label="Ohjaimet">
        <button class="up" data-dir="up" aria-label="Ylös">▲</button>
        <button class="left" data-dir="left" aria-label="Vasemmalle">◀</button>
        <button class="ok" id="start" aria-label="Aloita tai jatka">OK</button>
        <button class="right" data-dir="right" aria-label="Oikealle">▶</button>
        <button class="down" data-dir="down" aria-label="Alas">▼</button>
      </nav>
    </div>
    <p class="help">Nuolinäppäimet / WASD · välilyönti pysäyttää · puhelimella pyyhkäise</p>
  </main>
  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.querySelector('#score');
    const bestEl = document.querySelector('#best');
    const message = document.querySelector('#message');
    const size = 20;
    const cells = canvas.width / size;
    const colors = { screen: '#9eae79', pixel: '#18271f', shade: '#637654' };
    const baseDelay = 180;
    const levels = {
      easy: { label: 'HELPPO', delay: 180 },
      normal: { label: 'NORMAALI', delay: 135 },
      hard: { label: 'VAIKEA', delay: 100 },
    };
    let snake, food, direction, queuedDirection, score, timer, running = false, paused = false;
    let level = localStorage.getItem('mato-level') || 'normal';
    if (!levels[level]) level = 'normal';
    let best = Number(localStorage.getItem('mato-best-speed-score') || 0);
    bestEl.textContent = best;

    function reset() {
      clearTimeout(timer);
      snake = [{x: 7, y: 7}, {x: 6, y: 7}, {x: 5, y: 7}];
      direction = {x: 1, y: 0};
      queuedDirection = direction;
      score = 0;
      scoreEl.textContent = score;
      paused = false;
      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = {x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells)};
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function speed() { return levels[level].delay; }

    function selectDifficulty(nextLevel) {
      if (!levels[nextLevel] || nextLevel === level) return;
      level = nextLevel;
      localStorage.setItem('mato-level', level);
      document.querySelectorAll('[data-level]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.level === level));
      });
      running = false;
      reset();
      message.innerHTML = `${levels[level].label}<br><small>Paina OK tai nuolinäppäintä</small>`;
      message.hidden = false;
    }

    function startGame(fresh = false) {
      if (fresh || !snake) reset();
      message.hidden = true;
      running = true;
      paused = false;
      clearTimeout(timer);
      timer = setTimeout(tick, speed());
      beep(510, .035);
    }

    function setDirection(next) {
      const dirs = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
      const wanted = dirs[next];
      if (!wanted) return;
      if (!running) startGame(true);
      if (wanted.x !== -direction.x || wanted.y !== -direction.y) queuedDirection = wanted;
    }

    function tick() {
      if (!running || paused) return;
      direction = queuedDirection;
      const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
      const hitWall = head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells;
      const hitSelf = snake.some(part => part.x === head.x && part.y === head.y);
      if (hitWall || hitSelf) return gameOver();
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += Math.round(10 * baseDelay / levels[level].delay);
        scoreEl.textContent = score;
        best = Math.max(best, score);
        bestEl.textContent = best;
        localStorage.setItem('mato-best-speed-score', best);
        placeFood();
        beep(760, .055);
      } else {
        snake.pop();
      }
      draw();
      timer = setTimeout(tick, speed());
    }

    function gameOver() {
      running = false;
      clearTimeout(timer);
      draw();
      message.innerHTML = `PELI PÄÄTTYI<br>PISTEET ${score}<br><small>Paina OK aloittaaksesi uudelleen</small>`;
      message.hidden = false;
      beep(180, .16);
    }

    function togglePause() {
      if (!running) return startGame();
      paused = !paused;
      clearTimeout(timer);
      message.innerHTML = 'TAUKO<br><small>Paina OK tai välilyöntiä</small>';
      message.hidden = !paused;
      if (!paused) timer = setTimeout(tick, speed());
    }

    function draw() {
      ctx.fillStyle = colors.screen;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#879765';
      ctx.lineWidth = 1;
      for (let n = 0; n <= cells; n++) {
        ctx.beginPath(); ctx.moveTo(n * size, 0); ctx.lineTo(n * size, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, n * size); ctx.lineTo(canvas.width, n * size); ctx.stroke();
      }
      ctx.fillStyle = colors.pixel;
      snake.forEach((part, index) => {
        ctx.fillRect(part.x * size + 2, part.y * size + 2, size - 4, size - 4);
        if (index === 0) {
          ctx.fillStyle = colors.screen;
          const eyeX = part.x * size + (direction.x >= 0 ? 12 : 5);
          const eyeY = part.y * size + (direction.y >= 0 ? 12 : 5);
          ctx.fillRect(eyeX, eyeY, 3, 3);
          ctx.fillStyle = colors.pixel;
        }
      });
      ctx.fillRect(food.x * size + 5, food.y * size + 5, size - 10, size - 10);
      ctx.strokeStyle = colors.pixel;
      ctx.strokeRect(food.x * size + 2, food.y * size + 2, size - 4, size - 4);
    }

    function beep(frequency, duration) {
      try {
        const audio = beep.audio || (beep.audio = new AudioContext());
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = 'square';
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.035, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + duration);
        oscillator.connect(gain).connect(audio.destination);
        oscillator.start(); oscillator.stop(audio.currentTime + duration);
      } catch {}
    }

    const keyMap = {ArrowUp:'up', w:'up', W:'up', ArrowDown:'down', s:'down', S:'down', ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right'};
    addEventListener('keydown', event => {
      if (keyMap[event.key]) { event.preventDefault(); setDirection(keyMap[event.key]); }
      if (event.code === 'Space') { event.preventDefault(); togglePause(); }
      if (event.key === 'Enter' && !running) startGame(true);
    });
    document.querySelectorAll('[data-dir]').forEach(button => button.addEventListener('pointerdown', () => setDirection(button.dataset.dir)));
    document.querySelectorAll('[data-level]').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.level === level));
      button.addEventListener('click', () => selectDifficulty(button.dataset.level));
    });
    document.querySelector('#pause').addEventListener('click', togglePause);
    document.querySelector('#restart').addEventListener('click', () => startGame(true));
    document.querySelector('#start').addEventListener('click', () => paused ? togglePause() : startGame(!running));
    message.addEventListener('click', () => paused ? togglePause() : startGame(!running));
    message.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') startGame(!running); });

    let touchStart;
    canvas.addEventListener('pointerdown', event => touchStart = {x:event.clientX, y:event.clientY});
    canvas.addEventListener('pointerup', event => {
      if (!touchStart) return;
      const dx = event.clientX - touchStart.x, dy = event.clientY - touchStart.y;
      touchStart = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
      setDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    });

    reset();
  </script>
</body>
</html>
