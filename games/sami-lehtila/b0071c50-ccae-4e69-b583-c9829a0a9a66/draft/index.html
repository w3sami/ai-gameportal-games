<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tanssiauto</title>
<style>
  :root { --ink: #1d1b26; --panel: rgba(24, 19, 48, 0.78); --text: #f5f1e6; --accent: #ffd23f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2350; color: var(--text);
    font: 14px/1.3 system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .panel { position: fixed; background: var(--panel); border-radius: 12px; padding: 8px 10px; }
  #tune { top: 8px; left: 8px; width: min(250px, 62vw); }
  #tune summary { cursor: pointer; font-weight: 700; }
  #tune h3 { margin: 8px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  #tune label { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 6px; font-size: 13px; }
  #tune input[type=range] { width: 100%; accent-color: var(--accent); touch-action: pan-x; }

  #top { top: 8px; right: 8px; display: flex; gap: 6px; background: none; padding: 0; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 2px solid transparent;
    border-radius: 12px; padding: 8px 12px; cursor: pointer; touch-action: none; }
  button.on { border-color: var(--accent); color: var(--accent); }

  #pad { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(3, minmax(64px, 96px)); gap: 6px; }
  #pad button { height: 54px; font-size: 20px; font-weight: 700; padding: 0; }
  #pad button small { display: block; font-size: 11px; font-weight: 400; opacity: .7; }
  #pad button.wide { font-size: 14px; }
  #help { position: fixed; left: 8px; bottom: 8px; max-width: 26vw; font-size: 12px; opacity: .65; }
  @media (max-width: 760px), (pointer: coarse) { #help { display: none; } }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<details id="tune" class="panel" open>
  <summary>Jousitus</summary>
  <h3>Etujalat</h3>
  <label>Pituus <input type="range" id="frontLen" min="0.3" max="1.8" step="0.05" value="0.9"></label>
  <label>Löysyys <input type="range" id="frontLoose" min="0" max="1" step="0.02" value="0.5"></label>
  <h3>Takajalat</h3>
  <label>Pituus <input type="range" id="rearLen" min="0.3" max="1.8" step="0.05" value="0.9"></label>
  <label>Löysyys <input type="range" id="rearLoose" min="0" max="1" step="0.02" value="0.5"></label>
  <h3>Voima</h3>
  <label>Potku <input type="range" id="kick" min="2" max="16" step="0.5" value="6"></label>
</details>

<div id="top" class="panel">
  <button id="musicBtn">Musiikki</button>
  <button id="autoBtn" class="on">Tanssi itse</button>
</div>

<div id="pad">
  <button data-corner="0">↖<small>Q</small></button>
  <button data-act="stretch" class="wide">Venytys<small>W</small></button>
  <button data-corner="1">↗<small>E</small></button>
  <button data-corner="2">↙<small>A</small></button>
  <button data-act="squat" class="wide">Kyykky<small>S</small></button>
  <button data-corner="3">↘<small>D</small></button>
</div>

<div id="help">Q E A D nostaa yhtä kulmaa, nuolet kahta kerralla. W venyttää ja S kyykistää kaikki jalat; S ja sen perään W on hyppy. M = musiikki.</div>

<script src="js/main.js"></script>
</body>
</html>
