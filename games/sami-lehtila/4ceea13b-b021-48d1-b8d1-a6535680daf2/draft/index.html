<!doctype html>
<meta charset="utf-8">
<title>Tulostaulun tarkistus</title>
<style>
  body { background: #12141c; color: #e8ecf5; font: 15px/1.6 system-ui, sans-serif; padding: 1.5rem }
  button { font: inherit; padding: .4rem .9rem; border-radius: 8px; border: 1px solid #333c55;
           background: #1d2233; color: inherit; cursor: pointer }
  pre { background: #0b0d12; padding: .75rem; border-radius: 8px; overflow: auto; font-size: 13px }
  leaderboard-panel { --lb-accent: #4ade80; margin-top: 1rem; display: block }
</style>

<h1>Tulostaulun tarkistus</h1>
<button id="post">Lähetä satunnainen tulos</button>
<pre id="out">odottaa…</pre>
<leaderboard-panel board="tarkistus" limit="5"></leaderboard-panel>

<script type="module">
  import { submit, setName }
    from "https://plugins.game.bigbools.fi/leaderboard/v1/index.js";

  const out = document.querySelector("#out");
  const panel = document.querySelector("leaderboard-panel");
  setName("Tarkistus");

  document.querySelector("#post").onclick = async () => {
    const score = Math.floor(Math.random() * 10000);
    const answer = await submit({ score, board: "tarkistus", data: { taso: 3 } });
    out.textContent = JSON.stringify(answer, null, 2);
    if (answer.entry) panel.highlight = answer.entry.id;
    else panel.reload();
  };
</script>
